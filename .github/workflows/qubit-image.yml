# OctoComm fork: build the device-identity-patched driver (hetznercloud/csi-driver#1455).
name: qubit image
on:
  push:
    branches: ["qubit/**"]
    tags: ["v*-qubit.*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/volumes/ ./internal/driver/
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o hcloud-csi-driver ./cmd
      - name: Build image
        # .dockerignore excludes the binary; build from a context like goreleaser does.
        run: |
          mkdir context && cp Dockerfile hcloud-csi-driver context/
          docker build --platform linux/amd64 -t qubit-csi context
      - name: Push tagged image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/octocomm/hcloud-csi-driver:${GITHUB_REF_NAME}
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag qubit-csi "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" | tee -a "$GITHUB_STEP_SUMMARY"
