# OctoComm fork: validate and publish the device-identity-patched driver
# (hetznercloud/csi-driver#1455). Deploy by the digest printed on publish.
name: qubit image
on:
  pull_request:
  push:
    branches: ["qubit/**"]
    tags: ["v*-qubit.*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o hcloud-csi-driver ./cmd
      - name: Build image
        # .dockerignore excludes the binary; build from a context like goreleaser does.
        run: |
          mkdir context && cp Dockerfile hcloud-csi-driver context/
          docker build --platform linux/amd64 -t qubit-csi context

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o hcloud-csi-driver ./cmd
          mkdir context && cp Dockerfile hcloud-csi-driver context/
          image=ghcr.io/octocomm/hcloud-csi-driver:${GITHUB_REF_NAME}
          docker build --platform linux/amd64 -t "$image" context
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" | tee -a "$GITHUB_STEP_SUMMARY"
